---
# ============================================================================
# Teardown - Delete the minikube cluster and clean up
# Run from minikube/: ansible-playbook playbooks/teardown.yml
#
# This will:
#   1. Remove the /etc/resolver/{{ domain }} entry (and /etc/hosts fallback, if used)
#   2. Delete the minikube cluster
#   3. Remove local vault credentials and CA/containerd scratch files
# ============================================================================

- name: Confirm teardown
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Prompt for confirmation
      ansible.builtin.pause:
        prompt: |
          WARNING: This will delete the minikube cluster and all data in it!
            Profile: {{ minikube_profile }}
            DNS:     /etc/resolver/{{ domain }} will be removed

          Type 'yes' to continue
      register: confirm

    - name: Abort if not confirmed
      ansible.builtin.fail:
        msg: "Teardown aborted."
      when: confirm.user_input != 'yes'

- name: Remove DNS entries
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove /etc/resolver/{{ domain }}
      ansible.builtin.file:
        path: "/etc/resolver/{{ domain }}"
        state: absent
      become: true

    - name: Remove /etc/hosts fallback entries (if present)
      ansible.builtin.include_role:
        name: hosts_file
      vars:
        hosts_file_state: absent

- name: Delete minikube cluster
  hosts: localhost
  gather_facts: false
  tasks:
    - name: minikube delete
      ansible.builtin.command: minikube delete -p {{ minikube_profile }}
      become: false

    - name: Remove local vault credentials
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../.vault-credentials"
        state: absent
      become: false

    - name: Remove local CA/containerd scratch files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ playbook_dir }}/../.haaloft-ca.crt"
        - "{{ playbook_dir }}/../.containerd-hosts.toml"
      become: false

    - name: Teardown complete
      ansible.builtin.debug:
        msg: |
          =============================================
            Teardown Complete
          =============================================
          The minikube cluster and DNS entries have been removed.

          To rebuild:
            ansible-playbook site.yml
