# ============================================================================
# Global variables for the Haaloft K8S cluster - minikube (local dev) version
# ============================================================================

# --- Domain ---
# Kept identical to ansible/'s domain since the manifests under manifests/
# hardcode *.haaloft.local hostnames (not templated, same convention as ansible/).
domain: haaloft.local
cluster_name: haaloft

# --- minikube ---
minikube_profile: haaloft
minikube_driver: docker          # or: podman
minikube_container_runtime: containerd
minikube_cpus: 4
minikube_memory_mb: 8192
minikube_disk_size: 40g
minikube_addons:
  - ingress
  - ingress-dns
  - storage-provisioner
  - default-storageclass
  - metrics-server

# --- cert-manager ---
cert_issuer: haaloft-ca-issuer
acme_email: your-email@example.com

# --- Service URLs ---
harbor_host: "registry.{{ domain }}"
keycloak_host: "auth.{{ domain }}"
vault_host: "vault.{{ domain }}"
grafana_host: "grafana.{{ domain }}"

# --- Keycloak ---
keycloak_admin_user: admin
keycloak_admin_password: "changeme-use-vault-secret"
keycloak_pg_password: "changeme-pg-keycloak"

# --- Harbor ---
harbor_admin_password: "changeme-harbor-admin"

# --- DNS fallback ---
# ingress-dns is the primary mechanism (see roles/ingress_dns). If it doesn't
# route correctly for your driver, set this true and re-run --tags dns to
# fall back to static /etc/hosts entries instead.
hosts_file_fallback: false

# ============================================================================
# Services to deploy
# Always deployed: ingress, cert-manager
# Optional services: toggle true/false below
# ============================================================================
services:
  vault: true
  keycloak: true
  harbor: true
  monitoring: true
  homeassistant: false
  mqtt: false
  zigbee2mqtt: false
