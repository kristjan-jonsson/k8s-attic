---
# Keycloak Identity and Access Management
# Deployed via plain manifests (no Helm chart needed)

- name: Create Keycloak namespace
  ansible.builtin.command: >
    kubectl apply -f {{ manifests_dir }}/keycloak/namespace.yaml --context {{ minikube_profile }}
  become: false

- name: Deploy Keycloak and PostgreSQL
  ansible.builtin.command: >
    kubectl apply -f {{ manifests_dir }}/keycloak/keycloak-deploy.yaml --context {{ minikube_profile }}
  become: false

- name: Wait for Keycloak to be ready
  ansible.builtin.shell: |
    kubectl -n keycloak --context {{ minikube_profile }} wait --for=condition=Available deployment/keycloak --timeout=300s
  become: false
  retries: 3
  delay: 30
  register: kc_ready
  until: kc_ready is not failed
  changed_when: false

- name: Apply example realm config
  ansible.builtin.command: >
    kubectl apply -f {{ manifests_dir }}/keycloak/keycloak-realm-example.yaml --context {{ minikube_profile }}
  become: false
