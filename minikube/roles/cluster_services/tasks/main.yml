---
# ============================================================================
# Deploy all cluster services onto the local minikube cluster
#
# Manifests live under minikube/manifests/ (self-contained, no dependency on
# ansible/ or the top-level manifests/) and are referenced directly from
# their local path - no remote copy step needed since Ansible and the
# cluster both run on this Mac.
#
# Default services (always deployed): ingress, cert-manager
# Optional services controlled by 'services' dict in group_vars/all.yml
#
# Tags:  ansible-playbook site.yml --tags monitoring
#        ansible-playbook site.yml --tags keycloak
# ============================================================================

- name: Set manifests path fact
  ansible.builtin.set_fact:
    manifests_dir: "{{ playbook_dir }}/../manifests"

# --- Default services (always deployed) ---

- name: Include ingress verification
  ansible.builtin.include_tasks:
    file: ingress.yml
    apply:
      tags: [ingress]
  tags: [ingress]

- name: Include cert-manager
  ansible.builtin.include_tasks:
    file: cert_manager.yml
    apply:
      tags: [cert-manager]
  tags: [cert-manager]

# --- Optional services (toggle in group_vars/all.yml) ---

- name: Include Vault
  ansible.builtin.include_tasks:
    file: vault.yml
    apply:
      tags: [vault]
  tags: [vault]
  when: services.vault | default(false)

- name: Include Keycloak
  ansible.builtin.include_tasks:
    file: keycloak.yml
    apply:
      tags: [keycloak]
  tags: [keycloak]
  when: services.keycloak | default(false)

- name: Include monitoring (Prometheus + Grafana)
  ansible.builtin.include_tasks:
    file: monitoring.yml
    apply:
      tags: [monitoring]
  tags: [monitoring]
  when: services.monitoring | default(false)

- name: Include Home Assistant
  ansible.builtin.include_tasks:
    file: homeassistant.yml
    apply:
      tags: [homeassistant]
  tags: [homeassistant]
  when: services.homeassistant | default(false)

- name: Include MQTT broker (Mosquitto)
  ansible.builtin.include_tasks:
    file: mqtt.yml
    apply:
      tags: [mqtt, zigbee]
  tags: [mqtt, zigbee]
  when: services.mqtt | default(false)

- name: Include Zigbee2MQTT
  ansible.builtin.include_tasks:
    file: zigbee2mqtt.yml
    apply:
      tags: [zigbee]
  tags: [zigbee]
  when: services.zigbee2mqtt | default(false)
