---
# Mosquitto MQTT Broker

- name: Deploy Mosquitto MQTT broker
  ansible.builtin.command: >
    kubectl apply -f {{ manifests_dir }}/mqtt/mosquitto-deploy.yaml --context {{ minikube_profile }}
  become: false

- name: Wait for Mosquitto to be ready
  ansible.builtin.shell: |
    kubectl -n mqtt --context {{ minikube_profile }} wait --for=condition=Available deployment/mosquitto --timeout=120s
  become: false
  changed_when: false
