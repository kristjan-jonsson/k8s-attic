---
# ============================================================================
# Harbor Container Registry
# ============================================================================

- name: Set manifests path fact
  ansible.builtin.set_fact:
    manifests_dir: "{{ playbook_dir }}/../manifests"

- name: Install Harbor
  ansible.builtin.command: >
    helm upgrade --install harbor harbor/harbor
    --namespace harbor --create-namespace
    --kube-context {{ minikube_profile }}
    --values {{ manifests_dir }}/harbor/harbor-values.yaml
    --timeout 15m
  become: false

- name: Wait for the internal CA secret to exist
  ansible.builtin.command: >
    kubectl -n cert-manager --context {{ minikube_profile }} get secret haaloft-ca-secret -o jsonpath={.data.ca\.crt}
  become: false
  register: ca_secret
  retries: 10
  delay: 10
  until: ca_secret.rc == 0 and ca_secret.stdout != ''
  changed_when: false

- name: Write the internal CA cert locally
  ansible.builtin.copy:
    content: "{{ ca_secret.stdout | b64decode }}"
    dest: "{{ playbook_dir }}/../.haaloft-ca.crt"
    mode: "0644"
  become: false

- name: Trust the internal CA inside the minikube node
  ansible.builtin.shell: >
    cat {{ playbook_dir }}/../.haaloft-ca.crt |
    minikube ssh -p {{ minikube_profile }} -- sudo tee /usr/local/share/ca-certificates/haaloft-ca.crt > /dev/null
  become: false
  changed_when: true

- name: Refresh the minikube node's CA trust store
  ansible.builtin.command: minikube ssh -p {{ minikube_profile }} -- sudo update-ca-certificates
  become: false
  changed_when: true

- name: Create containerd registry mirror directory inside the minikube node
  ansible.builtin.command: >
    minikube ssh -p {{ minikube_profile }} -- sudo mkdir -p /etc/containerd/certs.d/{{ harbor_host }}
  become: false
  changed_when: true

- name: Template containerd registry mirror config locally
  ansible.builtin.template:
    src: containerd-hosts.toml.j2
    dest: "{{ playbook_dir }}/../.containerd-hosts.toml"
    mode: "0644"
  become: false

- name: Copy containerd registry mirror config into the minikube node
  ansible.builtin.shell: >
    cat {{ playbook_dir }}/../.containerd-hosts.toml |
    minikube ssh -p {{ minikube_profile }} --
    sudo tee /etc/containerd/certs.d/{{ harbor_host }}/hosts.toml > /dev/null
  become: false
  changed_when: true

- name: Restart containerd inside the minikube node
  ansible.builtin.command: minikube ssh -p {{ minikube_profile }} -- sudo systemctl restart containerd
  become: false
  changed_when: true

- name: Display Harbor info
  ansible.builtin.debug:
    msg: |
      Harbor deployed!
      UI:       https://{{ harbor_host }}
      User:     admin
      Password: {{ harbor_admin_password }}

      The internal CA has been trusted inside the minikube node, so in-cluster image
      pulls/pushes from {{ harbor_host }} work without extra configuration.

      To push from THIS Mac (docker/podman CLI), trust the CA locally too, e.g.:
        macOS system trust store:
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain .haaloft-ca.crt
        or add {{ harbor_host }} as an insecure registry in Docker/Podman Desktop settings.

      Then:
        docker login {{ harbor_host }}
        docker tag myapp:latest {{ harbor_host }}/library/myapp:latest
        docker push {{ harbor_host }}/library/myapp:latest
