---
# ============================================================================
# Start (or reuse) the local minikube cluster
# Replaces ansible/'s VM provisioning + discovery + RKE2 install entirely.
# ============================================================================

- name: Check current minikube status
  ansible.builtin.command: minikube status -p {{ minikube_profile }}
  become: false
  register: minikube_status
  changed_when: false
  failed_when: false

- name: Start minikube cluster
  ansible.builtin.command: >
    minikube start -p {{ minikube_profile }}
    --driver={{ minikube_driver }}
    --container-runtime={{ minikube_container_runtime }}
    --cpus={{ minikube_cpus }}
    --memory={{ minikube_memory_mb }}
    --disk-size={{ minikube_disk_size }}
    --addons={{ minikube_addons | join(',') }}
  become: false
  when: "'host: Running' not in minikube_status.stdout"

- name: Ensure all requested addons are enabled
  ansible.builtin.command: minikube addons enable {{ item }} -p {{ minikube_profile }}
  become: false
  loop: "{{ minikube_addons }}"
  changed_when: false

- name: Set kubectl context to the minikube profile
  ansible.builtin.command: kubectl config use-context {{ minikube_profile }}
  become: false
  changed_when: false

- name: Wait for all nodes to be Ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready node --all --timeout=180s --context {{ minikube_profile }}
  become: false
  changed_when: false

- name: Read minikube IP
  ansible.builtin.command: minikube ip -p {{ minikube_profile }}
  become: false
  register: minikube_ip_result
  changed_when: false

- name: Set minikube_ip fact
  ansible.builtin.set_fact:
    minikube_ip: "{{ minikube_ip_result.stdout }}"
