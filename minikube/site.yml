---
# ============================================================================
# Haaloft K8S Cluster - minikube (local dev) version - Master Playbook
#
# Full deploy:              ansible-playbook site.yml
# Just services:             ansible-playbook site.yml --tags "services"
# Just one service:          ansible-playbook site.yml --tags "monitoring"
# Teardown everything:       ansible-playbook playbooks/teardown.yml
# ============================================================================

# --- Stage 1: Start (or reuse) the local minikube cluster ---
- name: Start minikube cluster
  hosts: localhost
  tags: [cluster]
  roles:
    - minikube_cluster

# --- Stage 2: DNS for *.{{ domain }} via ingress-dns addon ---
- name: Configure DNS
  hosts: localhost
  tags: [dns]
  roles:
    - ingress_dns
    - role: hosts_file
      when: hosts_file_fallback | default(false)

# --- Stage 3: Install Helm ---
- name: Install Helm
  hosts: localhost
  tags: [helm, services]
  roles:
    - helm

# --- Stage 4: Deploy cluster services ---
- name: Deploy cluster services
  hosts: localhost
  tags: [services, ingress, cert-manager, vault, keycloak, monitoring, homeassistant, mqtt, zigbee]
  roles:
    - cluster_services

# --- Stage 5: Deploy Harbor container registry ---
- name: Deploy Harbor registry
  hosts: localhost
  tags: [services, harbor]
  roles:
    - role: harbor
      when: services.harbor | default(false)

# --- Final: Display summary ---
- name: Deployment summary
  hosts: localhost
  tags: [always]
  tasks:
    - name: Show cluster info
      ansible.builtin.debug:
        msg: |
          =============================================
            Haaloft K8S Cluster (minikube) Deployed!
          =============================================

          kubectl context: {{ minikube_profile }}
            kubectl config use-context {{ minikube_profile }}

          Services:
            Ingress:      NGINX (minikube ingress addon)
            Certificates: cert-manager ({{ cert_issuer }})
            Secrets:      https://{{ vault_host }}
            Auth:         https://{{ keycloak_host }}
            Registry:     https://{{ harbor_host }}
            Monitoring:   https://{{ grafana_host }}

          DNS: *.{{ domain }} resolved via minikube's ingress-dns addon (see .../etc/resolver/{{ domain }})
          If using the docker/podman driver, keep `minikube tunnel -p {{ minikube_profile }}`
          running in a separate terminal for ingress/DNS to route correctly.

          Push images:
            docker login {{ harbor_host }}
            docker tag myapp:latest {{ harbor_host }}/library/myapp:latest
            docker push {{ harbor_host }}/library/myapp:latest
