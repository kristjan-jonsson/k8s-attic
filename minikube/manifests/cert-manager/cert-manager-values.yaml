# ============================================================================
# cert-manager - Automatic TLS Certificate Management
# Install: helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace \
#   --set crds.enabled=true -f cert-manager-values.yaml
# ============================================================================

# Resource limits for local dev
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

cainjector:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
