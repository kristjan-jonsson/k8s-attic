# ============================================================================
# HashiCorp Vault - Secret Management
# Install: helm install vault hashicorp/vault -n vault --create-namespace -f vault-values.yaml
# ============================================================================

server:
  # Single-node mode for local dev (no HA/raft needed)
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/vault/data"
      }

  # Persistent storage for Vault data (minikube's built-in storage-provisioner)
  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: standard

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  # Ingress for Vault UI
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - host: vault.haaloft.local
    tls:
      - secretName: vault-tls
        hosts:
          - vault.haaloft.local
    annotations:
      cert-manager.io/cluster-issuer: haaloft-ca-issuer

# Enable the Vault UI
ui:
  enabled: true

# Vault Agent Injector - automatically injects secrets into pods
injector:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
