all:
  children:
    # KVM hypervisor host (for VM provisioning and teardown)
    hypervisor:
      hosts:
        kvm-host:
          ansible_host: 192.168.1.1    # Update with KVM host IP
          ansible_user: root

    # These groups are populated dynamically by provision-vms.yml / site.yml
    # after discovering DHCP-assigned IPs from the hypervisor.
    # You can also hardcode IPs here if you prefer static inventory.
    rke2_servers:
      hosts: {}
    rke2_agents:
      hosts: {}
    rke2_cluster:
      children:
        rke2_servers:
        rke2_agents:
