all:
  children:
    # BIND DNS server (for *.haaloft.local registration)
    dns_servers:
      hosts:
        dns-01:
          ansible_host: 192.168.0.52   # Update with DNS server IP

    # These groups are populated dynamically by discover-vms.yml
    # after discovering DHCP-assigned IPs via virsh on localhost.
    rke2_servers:
      hosts: {}
    rke2_agents:
      hosts: {}
    rke2_cluster:
      children:
        rke2_servers:
        rke2_agents:
