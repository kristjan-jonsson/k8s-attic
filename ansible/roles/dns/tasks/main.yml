---
# ============================================================================
# Register cluster node IPs and service hostnames in BIND (named)
#
# Creates/updates the forward zone for {{ domain }} with:
#   - A records for each node (rke-01, rke-02, rke-03)
#   - Round-robin A records for each service hostname
#   - Wildcard catch-all pointing to all nodes
#
# Expects `discovered_vms` fact from discover-vms.yml:
#   [{ name: "rke-01", role: "server", ip: "192.168.1.x" }, ...]
# ============================================================================

- name: Ensure bind is installed
  ansible.builtin.dnf:
    name:
      - bind
      - bind-utils
    state: present

- name: Backup named.conf before modifications
  ansible.builtin.copy:
    src: /etc/named.conf
    dest: /etc/named.conf.bak.{{ ansible_date_time.iso8601_basic_short }}
    remote_src: true
    mode: "0644"

- name: Generate zone serial (YYYYMMDDNN)
  ansible.builtin.set_fact:
    dns_zone_serial: "{{ '%Y%m%d01' | strftime }}"

- name: Deploy forward zone file for {{ domain }}
  ansible.builtin.template:
    src: zone-forward.j2
    dest: "{{ dns_zone_dir }}/{{ dns_zone_file }}"
    owner: named
    group: named
    mode: "0640"
  notify: reload named

- name: Ensure named.conf includes our zone
  ansible.builtin.blockinfile:
    path: /etc/named.conf
    block: |
      zone "{{ domain }}" IN {
          type master;
          file "{{ dns_zone_file }}";
          allow-update { none; };
      };
    marker: "// {mark} ANSIBLE MANAGED - {{ domain }}"
    insertafter: EOF
  notify: reload named

# - name: Ensure named listens on all interfaces
#   ansible.builtin.replace:
#     path: /etc/named.conf
#     regexp: '(listen-on port 53\s*\{)[^}]*(\};)'
#     replace: '\1 any; \2'
#   notify: reload named

- name: Ensure named allows queries from local network
  ansible.builtin.replace:
    path: /etc/named.conf
    regexp: '(allow-query\s*\{)[^}]*(\};)'
    replace: '\1 any; \2'
  notify: reload named

- name: Validate named.conf syntax
  ansible.builtin.command: named-checkconf /etc/named.conf
  changed_when: false

- name: Flush handlers to reload named now
  ansible.builtin.meta: flush_handlers

- name: Enable and start named
  ansible.builtin.systemd:
    name: named
    state: started
    enabled: true

- name: Restart named to pick up all changes
  ansible.builtin.systemd:
    name: named
    state: restarted

- name: Verify zone resolves
  ansible.builtin.command: "dig @127.0.0.1 {{ (vms | first).name }}.{{ domain }} +short"
  register: dig_check
  changed_when: false
  failed_when: dig_check.stdout | trim | length == 0
