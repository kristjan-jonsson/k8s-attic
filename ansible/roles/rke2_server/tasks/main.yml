---
# ============================================================================
# RKE2 Server (Control Plane) Installation
# ============================================================================

- name: Create RKE2 config directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: Deploy RKE2 server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0644"

- name: Download RKE2 installer
  ansible.builtin.get_url:
    url: https://get.rke2.io
    dest: /tmp/rke2-install.sh
    mode: "0755"

- name: Install RKE2 server
  ansible.builtin.command: /tmp/rke2-install.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version | default(omit) }}"
  args:
    creates: /usr/local/bin/rke2

- name: Override RKE2 server systemd timeout
  ansible.builtin.file:
    path: /etc/systemd/system/rke2-server.service.d
    state: directory
    mode: "0755"

- name: Set RKE2 server startup timeout to 10 minutes
  ansible.builtin.copy:
    dest: /etc/systemd/system/rke2-server.service.d/override.conf
    content: |
      [Service]
      TimeoutStartSec=600
    mode: "0644"

- name: Reload systemd
  ansible.builtin.command: systemctl daemon-reload
  changed_when: false

- name: Enable rke2-server service
  ansible.builtin.systemd:
    name: rke2-server
    enabled: true

- name: Start rke2-server
  ansible.builtin.command: systemctl start rke2-server
  async: 600
  poll: 0
  register: rke2_start

- name: Wait for node token (RKE2 bootstrap complete)
  ansible.builtin.wait_for:
    path: /var/lib/rancher/rke2/server/node-token
    timeout: 600

- name: Wait for kubeconfig
  ansible.builtin.wait_for:
    path: /etc/rancher/rke2/rke2.yaml
    timeout: 60

- name: Read node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/rke2/server/node-token
  register: rke2_node_token_raw

- name: Set node token fact
  ansible.builtin.set_fact:
    rke2_node_token: "{{ rke2_node_token_raw.content | b64decode | trim }}"

# --- Wait for API server to be responsive ---
- name: Wait for API server
  ansible.builtin.shell: |
    /var/lib/rancher/rke2/bin/kubectl \
      --kubeconfig /etc/rancher/rke2/rke2.yaml \
      --server https://127.0.0.1:6443 \
      get ns default
  retries: 30
  delay: 10
  register: api_ready
  until: api_ready is not failed
  changed_when: false

# --- Install Cilium CNI ---
- name: Check if Helm is installed
  ansible.builtin.command: helm version --short
  register: helm_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"

- name: Install Helm
  when: helm_check.rc != 0
  block:
    - name: Download Helm installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm.sh
        mode: "0755"

    - name: Run Helm installer
      ansible.builtin.command: /tmp/get-helm.sh

- name: Add Cilium Helm repo
  ansible.builtin.command: helm repo add cilium https://helm.cilium.io/
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  changed_when: false
  failed_when: false

- name: Install Cilium
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
    export PATH=/var/lib/rancher/rke2/bin:$PATH

    # Set server to 127.0.0.1 in kubeconfig for helm
    kubectl config set-cluster default --server=https://127.0.0.1:6443

    helm upgrade --install cilium cilium/cilium \
      --namespace kube-system \
      --set operator.replicas=1 \
      --set kubeProxyReplacement=true \
      --set k8sServiceHost=127.0.0.1 \
      --set k8sServicePort=6443 \
      --set cni.exclusive=false \
      --wait --timeout 5m
  register: cilium_install
  changed_when: "'has been upgraded' in cilium_install.stdout or 'has been installed' in cilium_install.stdout"

# --- Wait for node to be Ready (now that Cilium is installed) ---
- name: Wait for node to register and be Ready
  ansible.builtin.shell: |
    KC="--kubeconfig /etc/rancher/rke2/rke2.yaml --server https://127.0.0.1:6443"
    node=$(/var/lib/rancher/rke2/bin/kubectl $KC get nodes -o name 2>/dev/null | head -1)
    [ -z "$node" ] && exit 1
    /var/lib/rancher/rke2/bin/kubectl $KC wait --for=condition=Ready "$node" --timeout=30s
  retries: 20
  delay: 15
  register: node_ready
  until: node_ready is not failed
  changed_when: false

# --- Set up kubeconfig for rke user and fetch locally ---
- name: Create .kube directory for rke user
  ansible.builtin.file:
    path: /home/rke/.kube
    state: directory
    owner: rke
    group: rke
    mode: "0700"

- name: Copy kubeconfig for rke user
  ansible.builtin.copy:
    src: /etc/rancher/rke2/rke2.yaml
    dest: /home/rke/.kube/config
    remote_src: true
    owner: rke
    group: rke
    mode: "0600"

- name: Update kubeconfig server address for remote access
  ansible.builtin.replace:
    path: /home/rke/.kube/config
    regexp: '127\.0\.0\.1'
    replace: "{{ ansible_host }}"

- name: Fetch kubeconfig to local machine
  ansible.builtin.fetch:
    src: /home/rke/.kube/config
    dest: "{{ playbook_dir }}/../kubeconfig"
    flat: true

- name: Add RKE2 binaries to PATH for rke user
  ansible.builtin.blockinfile:
    path: /home/rke/.bashrc
    block: |
      export PATH=$PATH:/var/lib/rancher/rke2/bin
      export KUBECONFIG=$HOME/.kube/config
      alias k=kubectl
      source <(kubectl completion bash)
      complete -o default -F __start_kubectl k
    marker: "# {mark} RKE2 PATH"
