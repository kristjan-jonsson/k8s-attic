---
# ============================================================================
# Common OS configuration for all RKE2 nodes
# ============================================================================

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Update /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ ansible_host }} {{ inventory_hostname }} {{ inventory_hostname }}.{{ domain }}"
    state: present

- name: Install required packages
  ansible.builtin.dnf:
    name:
      - curl
      - wget
      - vim
      - git
      - bash-completion
      - container-selinux
      - iscsi-initiator-utils
      - nfs-utils
    state: present

- name: Load kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - br_netfilter
    - overlay
    - iscsi_tcp
  changed_when: false

- name: Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      br_netfilter
      overlay
      iscsi_tcp
    mode: "0644"

- name: Set sysctl parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: "0644"
  notify: reload sysctl

- name: Disable swap
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Disable firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  ignore_errors: true

- name: Set SELinux to permissive
  ansible.builtin.command: setenforce 0
  changed_when: false
  failed_when: false

- name: Persist SELinux permissive
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX=enforcing'
    line: 'SELINUX=permissive'

- name: Enable iscsid for Longhorn
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: true

- name: Configure NetworkManager for RKE2 CNI
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/rke2-canal.conf
    content: |
      [keyfile]
      unmanaged-devices=interface-name:cali*;interface-name:flannel*
    mode: "0644"
  notify: restart networkmanager
