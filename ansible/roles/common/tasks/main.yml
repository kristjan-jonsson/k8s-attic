---
# ============================================================================
# Common OS configuration for all RKE2 nodes
# ============================================================================

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Update /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ ansible_host }} {{ inventory_hostname }} {{ inventory_hostname }}.{{ domain }}"
    state: present

- name: Install required packages
  ansible.builtin.dnf:
    name:
      - curl
      - wget
      - vim
      - git
      - bash-completion
      - container-selinux
      - iscsi-initiator-utils
      - nfs-utils
    state: present

- name: Install UEK netfilter modules (Oracle Linux)
  ansible.builtin.shell: |
    dnf install -y kernel-uek-modules-extra-netfilter-$(uname -r) 2>/dev/null || true
  changed_when: false

- name: Load kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - br_netfilter
    - overlay
    - iscsi_tcp
    - ip_tables
    - iptable_filter
    - iptable_nat
  changed_when: false

- name: Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      br_netfilter
      overlay
      iscsi_tcp
      ip_tables
      iptable_filter
      iptable_nat
    mode: "0644"

- name: Set sysctl parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: "0644"
  notify: reload sysctl

- name: Disable swap
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Disable firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  ignore_errors: true

- name: Set SELinux to permissive
  ansible.builtin.command: setenforce 0
  changed_when: false
  failed_when: false

- name: Persist SELinux permissive
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX=enforcing'
    line: 'SELINUX=permissive'

# --- Extend LVM to use full disk for Longhorn storage ---
- name: Install growpart
  ansible.builtin.dnf:
    name: cloud-utils-growpart
    state: present

- name: Grow LVM partition to fill disk
  ansible.builtin.command: growpart /dev/vda 4
  register: growpart_result
  changed_when: "'CHANGED' in growpart_result.stdout"
  failed_when: false

- name: Resize PV to use expanded partition
  ansible.builtin.command: pvresize /dev/vda4
  when: growpart_result.changed
  changed_when: true

- name: Get root LV path
  ansible.builtin.shell: |
    lvs --noheadings -o lv_path -S 'lv_attr=~[^s]wi' | grep -v swap | head -1 | tr -d ' '
  register: root_lv
  changed_when: false

- name: Extend root LV to use all free space
  ansible.builtin.command: "lvextend -l +100%FREE {{ root_lv.stdout }}"
  when: growpart_result.changed
  register: lvextend_result
  changed_when: "'successfully resized' in lvextend_result.stdout"
  failed_when: false

- name: Grow XFS filesystem
  ansible.builtin.command: "xfs_growfs {{ root_lv.stdout }}"
  when: lvextend_result is changed
  changed_when: true

- name: Enable iscsid for Longhorn
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: true

- name: Configure NetworkManager for RKE2 CNI
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/rke2-canal.conf
    content: |
      [keyfile]
      unmanaged-devices=interface-name:cali*;interface-name:flannel*
    mode: "0644"
  notify: restart networkmanager
