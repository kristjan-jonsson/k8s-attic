---
# ============================================================================
# RKE2 Agent (Worker) Installation
# ============================================================================

- name: Create RKE2 config directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: Deploy RKE2 agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0644"

- name: Download RKE2 installer
  ansible.builtin.get_url:
    url: https://get.rke2.io
    dest: /tmp/rke2-install.sh
    mode: "0755"

- name: Install RKE2 agent
  ansible.builtin.command: /tmp/rke2-install.sh
  environment:
    INSTALL_RKE2_TYPE: agent
    INSTALL_RKE2_VERSION: "{{ rke2_version | default(omit) }}"
  args:
    creates: /usr/local/bin/rke2

- name: Enable and start RKE2 agent
  ansible.builtin.systemd:
    name: rke2-agent
    state: started
    enabled: true

- name: Wait for agent to join cluster
  ansible.builtin.command: >
    /var/lib/rancher/rke2/bin/kubectl
    --kubeconfig /etc/rancher/rke2/rke2.yaml
    wait --for=condition=Ready node/{{ inventory_hostname }}
    --timeout=300s
  delegate_to: "{{ groups['rke2_servers'][0] }}"
  changed_when: false
