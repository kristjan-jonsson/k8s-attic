---
# Longhorn distributed storage

- name: Install Longhorn
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    release_namespace: longhorn-system
    create_namespace: true
    kubeconfig: /home/rke/.kube/config
    values_files:
      - "{{ playbook_dir }}/../manifests/storage/longhorn-values.yaml"
    wait: true
    wait_timeout: 600s

- name: Apply custom storage classes
  kubernetes.core.k8s:
    kubeconfig: /home/rke/.kube/config
    state: present
    src: "{{ playbook_dir }}/../manifests/storage/storage-classes.yaml"
