---
# cert-manager installation and configuration

- name: Install cert-manager
  ansible.builtin.command: >
    helm upgrade --install cert-manager jetstack/cert-manager
    --namespace cert-manager --create-namespace
    --values {{ playbook_dir }}/../manifests/cert-manager/cert-manager-values.yaml
    --set crds.enabled=true
    --wait --timeout 5m
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"

- name: Wait for cert-manager webhook
  ansible.builtin.pause:
    seconds: 15

- name: Apply cluster issuers
  ansible.builtin.command: >
    kubectl apply -f {{ playbook_dir }}/../manifests/cert-manager/cluster-issuers.yaml
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"
