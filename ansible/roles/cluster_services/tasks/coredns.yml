---
# CoreDNS custom configuration - forward *.haaloft.local to BIND

- name: Template CoreDNS custom config
  ansible.builtin.template:
    src: coredns-custom.yaml.j2
    dest: /tmp/coredns-custom.yaml
    mode: "0644"

- name: Apply CoreDNS custom config
  ansible.builtin.command: >
    kubectl apply -f /tmp/coredns-custom.yaml
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"

- name: Restart CoreDNS to pick up changes
  ansible.builtin.command: >
    kubectl -n kube-system rollout restart deployment rke2-coredns-rke2-coredns
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"
  ignore_errors: true

- name: Clean up temp file
  ansible.builtin.file:
    path: /tmp/coredns-custom.yaml
    state: absent
