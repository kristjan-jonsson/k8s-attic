---
# NGINX Ingress Controller configuration (RKE2 built-in)

- name: Apply NGINX Ingress custom configuration
  ansible.builtin.command: >
    kubectl apply -f {{ playbook_dir }}/../manifests/ingress/nginx-config.yaml
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"
