---
# ArgoCD - GitOps continuous delivery

# Also added in the helm role; repeated here so `--tags argocd` works on its own
- name: Add argo Helm repo
  ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"
  changed_when: false
  failed_when: false

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"
  changed_when: false

- name: Install ArgoCD
  ansible.builtin.command: >
    helm upgrade --install argocd argo/argo-cd
    --namespace argocd --create-namespace
    --values /tmp/k8s-manifests/argocd/argocd-values.yaml
    --timeout 10m
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"

- name: Wait for ArgoCD server to be ready
  ansible.builtin.shell: |
    kubectl -n argocd wait --for=condition=Available deployment/argocd-server --timeout=300s
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"
  retries: 3
  delay: 30
  register: argocd_ready
  until: argocd_ready is not failed
  changed_when: false

# The initial admin secret exists until you delete it after changing the password
- name: Read initial admin password
  ansible.builtin.shell: |
    kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' 2>/dev/null | base64 -d
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"
  register: argocd_admin_password
  changed_when: false
  failed_when: false
  no_log: true

- name: Save ArgoCD credentials locally
  when: argocd_admin_password.stdout | length > 0
  ansible.builtin.copy:
    content: |
      # ARGOCD CREDENTIALS - KEEP SECURE!
      # Change the password in the UI, then delete the argocd-initial-admin-secret secret.
      ARGOCD_URL=https://{{ argocd_host }}
      ARGOCD_ADMIN_USER=admin
      ARGOCD_ADMIN_PASSWORD={{ argocd_admin_password.stdout }}
    dest: "{{ playbook_dir }}/../.argocd-credentials"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Display ArgoCD info
  ansible.builtin.debug:
    msg: |
      ArgoCD deployed!
      UI:       https://{{ argocd_host }}
      User:     admin
      Password: {{ 'saved to .argocd-credentials' if argocd_admin_password.stdout | length > 0 else 'initial secret already removed (use your changed password)' }}
