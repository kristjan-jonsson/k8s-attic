---
# Keycloak Identity and Access Management

- name: Create Keycloak namespace
  ansible.builtin.command: >
    kubectl apply -f /tmp/k8s-manifests/keycloak/namespace.yaml
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"

- name: Install Keycloak
  ansible.builtin.command: >
    helm upgrade --install keycloak bitnami/keycloak
    --namespace keycloak
    --values /tmp/k8s-manifests/keycloak/keycloak-values.yaml
    --wait --timeout 10m
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"

- name: Apply example realm config
  ansible.builtin.command: >
    kubectl apply -f /tmp/k8s-manifests/keycloak/keycloak-realm-example.yaml
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"
