---
# Keycloak Identity and Access Management

- name: Create Keycloak namespace
  kubernetes.core.k8s:
    kubeconfig: /home/rke/.kube/config
    state: present
    src: "{{ playbook_dir }}/../manifests/keycloak/namespace.yaml"

- name: Install Keycloak
  kubernetes.core.helm:
    name: keycloak
    chart_ref: bitnami/keycloak
    release_namespace: keycloak
    kubeconfig: /home/rke/.kube/config
    values_files:
      - "{{ playbook_dir }}/../manifests/keycloak/keycloak-values.yaml"
    wait: true
    wait_timeout: 600s

- name: Apply example realm config
  kubernetes.core.k8s:
    kubeconfig: /home/rke/.kube/config
    state: present
    src: "{{ playbook_dir }}/../manifests/keycloak/keycloak-realm-example.yaml"
