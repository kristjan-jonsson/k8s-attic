---
# HashiCorp Vault

- name: Install Vault
  ansible.builtin.command: >
    helm upgrade --install vault hashicorp/vault
    --namespace vault --create-namespace
    --values {{ playbook_dir }}/../manifests/vault/vault-values.yaml
    --wait --timeout 5m
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"

- name: Wait for Vault pod to be running
  ansible.builtin.shell: |
    kubectl -n vault wait --for=condition=Ready pod/vault-0 --timeout=120s 2>/dev/null || true
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"
  changed_when: false

- name: Check if Vault is initialized
  ansible.builtin.shell: |
    kubectl -n vault exec vault-0 -- vault status -format=json 2>/dev/null
  register: vault_status
  failed_when: false
  changed_when: false
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"

- name: Initialize Vault
  when: vault_status.rc != 0 or (vault_status.stdout | from_json).initialized == false
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"
  block:
    - name: Run Vault init
      ansible.builtin.shell: |
        kubectl -n vault exec vault-0 -- vault operator init -key-shares=1 -key-threshold=1 -format=json
      register: vault_init

    - name: Parse Vault init output
      ansible.builtin.set_fact:
        vault_unseal_key: "{{ (vault_init.stdout | from_json).unseal_keys_b64[0] }}"
        vault_root_token: "{{ (vault_init.stdout | from_json).root_token }}"

    - name: Save Vault credentials locally
      ansible.builtin.copy:
        content: |
          # VAULT CREDENTIALS - KEEP SECURE!
          # Generated: {{ ansible_date_time.iso8601 }}
          VAULT_UNSEAL_KEY={{ vault_unseal_key }}
          VAULT_ROOT_TOKEN={{ vault_root_token }}
        dest: "{{ playbook_dir }}/../.vault-credentials"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Display Vault credentials
      ansible.builtin.debug:
        msg: |
          =========================================
            SAVE THESE VAULT CREDENTIALS!
          =========================================
          Unseal Key: {{ vault_unseal_key }}
          Root Token: {{ vault_root_token }}
          =========================================
          Also saved to: .vault-credentials

    - name: Unseal Vault
      ansible.builtin.shell: |
        kubectl -n vault exec vault-0 -- vault operator unseal {{ vault_unseal_key }}

    - name: Login to Vault
      ansible.builtin.shell: |
        kubectl -n vault exec vault-0 -- vault login {{ vault_root_token }}

    - name: Enable KV v2 secrets engine
      ansible.builtin.shell: |
        kubectl -n vault exec vault-0 -- vault secrets enable -path=secret kv-v2

    - name: Enable Kubernetes auth
      ansible.builtin.shell: |
        kubectl -n vault exec vault-0 -- vault auth enable kubernetes

    - name: Configure Kubernetes auth
      ansible.builtin.shell: |
        kubectl -n vault exec vault-0 -- sh -c 'vault write auth/kubernetes/config kubernetes_host="https://$KUBERNETES_PORT_443_TCP_ADDR:443"'

    - name: Create app-readonly policy
      ansible.builtin.shell: |
        kubectl -n vault exec vault-0 -- sh -c 'vault policy write app-readonly - <<EOF
        path "secret/data/apps/*" {
          capabilities = ["read", "list"]
        }
        EOF'

    - name: Create Kubernetes auth role
      ansible.builtin.shell: |
        kubectl -n vault exec vault-0 -- vault write auth/kubernetes/role/app-role bound_service_account_names=* bound_service_account_namespaces=default policies=app-readonly ttl=1h
