---
# HashiCorp Vault

- name: Install Vault
  kubernetes.core.helm:
    name: vault
    chart_ref: hashicorp/vault
    release_namespace: vault
    create_namespace: true
    kubeconfig: /home/rke/.kube/config
    values_files:
      - "{{ playbook_dir }}/../manifests/vault/vault-values.yaml"
    wait: true
    wait_timeout: 300s

- name: Wait for Vault pod to be running
  kubernetes.core.k8s_info:
    kubeconfig: /home/rke/.kube/config
    kind: Pod
    namespace: vault
    label_selectors:
      - app.kubernetes.io/name=vault
    wait: true
    wait_timeout: 120
    wait_condition:
      type: Ready
      status: "True"
  register: vault_pods
  ignore_errors: true  # Vault won't be Ready until initialized

- name: Check if Vault is initialized
  kubernetes.core.k8s_exec:
    kubeconfig: /home/rke/.kube/config
    namespace: vault
    pod: vault-0
    command: vault status -format=json
  register: vault_status
  failed_when: false
  changed_when: false

- name: Initialize Vault
  when: vault_status.rc != 0 or (vault_status.stdout | from_json).initialized == false
  block:
    - name: Run Vault init
      kubernetes.core.k8s_exec:
        kubeconfig: /home/rke/.kube/config
        namespace: vault
        pod: vault-0
        command: vault operator init -key-shares=1 -key-threshold=1 -format=json
      register: vault_init

    - name: Parse Vault init output
      ansible.builtin.set_fact:
        vault_unseal_key: "{{ (vault_init.stdout | from_json).unseal_keys_b64[0] }}"
        vault_root_token: "{{ (vault_init.stdout | from_json).root_token }}"

    - name: Save Vault credentials locally
      ansible.builtin.copy:
        content: |
          # VAULT CREDENTIALS - KEEP SECURE!
          # Generated: {{ ansible_date_time.iso8601 }}
          VAULT_UNSEAL_KEY={{ vault_unseal_key }}
          VAULT_ROOT_TOKEN={{ vault_root_token }}
        dest: "{{ playbook_dir }}/../.vault-credentials"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Display Vault credentials
      ansible.builtin.debug:
        msg: |
          =========================================
            SAVE THESE VAULT CREDENTIALS!
          =========================================
          Unseal Key: {{ vault_unseal_key }}
          Root Token: {{ vault_root_token }}
          =========================================
          Also saved to: .vault-credentials

    - name: Unseal Vault
      kubernetes.core.k8s_exec:
        kubeconfig: /home/rke/.kube/config
        namespace: vault
        pod: vault-0
        command: "vault operator unseal {{ vault_unseal_key }}"

    - name: Login to Vault
      kubernetes.core.k8s_exec:
        kubeconfig: /home/rke/.kube/config
        namespace: vault
        pod: vault-0
        command: "vault login {{ vault_root_token }}"

    - name: Enable KV v2 secrets engine
      kubernetes.core.k8s_exec:
        kubeconfig: /home/rke/.kube/config
        namespace: vault
        pod: vault-0
        command: vault secrets enable -path=secret kv-v2

    - name: Enable Kubernetes auth
      kubernetes.core.k8s_exec:
        kubeconfig: /home/rke/.kube/config
        namespace: vault
        pod: vault-0
        command: vault auth enable kubernetes

    - name: Configure Kubernetes auth
      kubernetes.core.k8s_exec:
        kubeconfig: /home/rke/.kube/config
        namespace: vault
        pod: vault-0
        command: >
          sh -c 'vault write auth/kubernetes/config
          kubernetes_host="https://$KUBERNETES_PORT_443_TCP_ADDR:443"'

    - name: Create app-readonly policy
      kubernetes.core.k8s_exec:
        kubeconfig: /home/rke/.kube/config
        namespace: vault
        pod: vault-0
        command: >
          sh -c 'vault policy write app-readonly - <<EOF
          path "secret/data/apps/*" {
            capabilities = ["read", "list"]
          }
          EOF'

    - name: Create Kubernetes auth role
      kubernetes.core.k8s_exec:
        kubeconfig: /home/rke/.kube/config
        namespace: vault
        pod: vault-0
        command: >
          vault write auth/kubernetes/role/app-role
          bound_service_account_names=*
          bound_service_account_namespaces=default
          policies=app-readonly
          ttl=1h
