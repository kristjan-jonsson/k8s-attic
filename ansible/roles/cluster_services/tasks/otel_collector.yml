---
# OpenTelemetry Collector - single OTLP endpoint for apps.
# Routes metrics -> Prometheus, logs -> Loki, traces -> Tempo.

# Also added in the helm role; repeated here so `--tags otel-collector` works on its own
- name: Add open-telemetry Helm repo
  ansible.builtin.command: helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"
  changed_when: false
  failed_when: false

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"
  changed_when: false

- name: Install OpenTelemetry Collector
  ansible.builtin.command: >
    helm upgrade --install otel-collector open-telemetry/opentelemetry-collector
    --namespace monitoring --create-namespace
    --version {{ otel_collector_chart_version }}
    --values /tmp/k8s-manifests/monitoring/otel-collector-values.yaml
    --timeout 10m
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"

- name: Wait for OpenTelemetry Collector to be ready
  ansible.builtin.shell: |
    kubectl -n monitoring wait --for=condition=Available deployment/otel-collector --timeout=180s
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"
  retries: 3
  delay: 30
  register: otel_ready
  until: otel_ready is not failed
  changed_when: false

- name: Display OpenTelemetry Collector info
  ansible.builtin.debug:
    msg: |
      OpenTelemetry Collector {{ otel_collector_chart_version }} deployed in namespace monitoring.
      Point apps at:
        OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.monitoring:4317   (gRPC, .NET default)
        or http://otel-collector.monitoring:4318 with OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      Routes: metrics -> Prometheus, logs -> Loki, traces -> Tempo
