---
# External Secrets Operator - syncs secrets from external stores into Kubernetes

# Also added in the helm role; repeated here so `--tags external-secrets` works on its own
- name: Add external-secrets Helm repo
  ansible.builtin.command: helm repo add external-secrets https://charts.external-secrets.io
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"
  changed_when: false
  failed_when: false

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  environment:
    PATH: "/usr/local/bin:/usr/bin:/bin"
  changed_when: false

- name: Install External Secrets Operator
  ansible.builtin.command: >
    helm upgrade --install external-secrets external-secrets/external-secrets
    --namespace external-secrets --create-namespace
    --version {{ external_secrets_chart_version }}
    --values /tmp/k8s-manifests/external-secrets/external-secrets-values.yaml
    --timeout 10m
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"

- name: Wait for External Secrets deployments to be ready
  ansible.builtin.shell: |
    kubectl -n external-secrets wait --for=condition=Available deployment --all --timeout=300s
  environment:
    KUBECONFIG: /home/rke/.kube/config
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin"
  retries: 3
  delay: 30
  register: eso_ready
  until: eso_ready is not failed
  changed_when: false

- name: Display External Secrets info
  ansible.builtin.debug:
    msg: |
      External Secrets Operator {{ external_secrets_chart_version }} deployed in namespace external-secrets.
      Next: create a SecretStore / ClusterSecretStore (e.g. pointing at Vault) and ExternalSecret resources.
