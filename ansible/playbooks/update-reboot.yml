---
# ============================================================================
# Update and reboot cluster nodes one at a time (rolling)
# Run: ansible-playbook playbooks/update-reboot.yml
#
# This will:
#   1. Discover VM IPs
#   2. For each node (one at a time):
#      - Cordon (prevent new pods)
#      - Drain (evict existing pods)
#      - Run dnf update (includes RKE2 patch releases in the current minor)
#      - Reboot if needed, or restart RKE2 if only its package changed
#      - Uncordon (allow pods again)
# ============================================================================

- name: Discover VM IPs
  ansible.builtin.import_playbook: discover-vms.yml

- name: Update and reboot cluster nodes (rolling)
  hosts: rke2_cluster
  become: true
  serial: 1
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
    PATH: "/var/lib/rancher/rke2/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

  tasks:
    - name: Get node name in K8S
      ansible.builtin.shell: |
        kubectl get nodes -o name | grep "$(hostname)" | head -1
      register: k8s_node_name
      changed_when: false
      delegate_to: "{{ groups['rke2_servers'][0] }}"

    - name: "Cordon {{ inventory_hostname }}"
      ansible.builtin.command: "kubectl cordon {{ k8s_node_name.stdout }}"
      delegate_to: "{{ groups['rke2_servers'][0] }}"
      when: k8s_node_name.stdout | length > 0

    - name: "Drain {{ inventory_hostname }}"
      ansible.builtin.command: >
        kubectl drain {{ k8s_node_name.stdout }}
        --ignore-daemonsets
        --delete-emptydir-data
        --timeout=120s
      delegate_to: "{{ groups['rke2_servers'][0] }}"
      when: k8s_node_name.stdout | length > 0

    - name: Record RKE2 package version before update
      ansible.builtin.command: rpm -q rke2-server rke2-agent
      register: rke2_rpm_before
      changed_when: false
      failed_when: false

    - name: Run dnf update
      ansible.builtin.dnf:
        name: "*"
        state: latest
      register: dnf_update

    # dnf can bring in a new RKE2 patch release from the rancher-rke2 repo
    - name: Record RKE2 package version after update
      ansible.builtin.command: rpm -q rke2-server rke2-agent
      register: rke2_rpm_after
      changed_when: false
      failed_when: false

    - name: Install netfilter modules for new kernel (if kernel was updated)
      ansible.builtin.shell: |
        # Find the newest installed kernel and install its netfilter modules
        new_kernel=$(rpm -q kernel-uek --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort -V | tail -1)
        dnf install -y "kernel-uek-modules-extra-netfilter-${new_kernel}" 2>/dev/null || true
      when: dnf_update.changed
      changed_when: false

    - name: Check if reboot is required
      ansible.builtin.shell: |
        needs-restarting -r
      register: reboot_check
      changed_when: false
      failed_when: false

    - name: "Reboot {{ inventory_hostname }}"
      ansible.builtin.reboot:
        reboot_timeout: 300
        msg: "Ansible: OS update reboot"
      when: reboot_check.rc != 0

    - name: Load iptables modules after reboot
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - ip_tables
        - iptable_filter
        - iptable_nat
      changed_when: false
      when: reboot_check.rc != 0

    # Package upgrades don't restart the service, so restart it here
    # (a reboot already starts the new version).
    - name: Restart RKE2 if its package was upgraded
      ansible.builtin.systemd:
        name: "{{ 'rke2-server' if inventory_hostname in groups['rke2_servers'] else 'rke2-agent' }}"
        state: restarted
      when:
        - rke2_rpm_before.stdout != rke2_rpm_after.stdout
        - reboot_check.rc == 0

    - name: Wait for RKE2 to be ready after reboot or restart
      ansible.builtin.shell: |
        systemctl is-active rke2-server 2>/dev/null || systemctl is-active rke2-agent 2>/dev/null
      retries: 30
      delay: 10
      register: rke2_ready
      until: rke2_ready is not failed
      changed_when: false
      when: reboot_check.rc != 0 or rke2_rpm_before.stdout != rke2_rpm_after.stdout

    # Retries cover the API server being briefly down after a server restart
    - name: Wait for node to be Ready in K8S
      ansible.builtin.shell: |
        kubectl wait --for=condition=Ready {{ k8s_node_name.stdout }} --timeout=300s
      delegate_to: "{{ groups['rke2_servers'][0] }}"
      register: node_ready
      retries: 10
      delay: 15
      until: node_ready is not failed
      changed_when: false
      when: k8s_node_name.stdout | length > 0

    - name: "Uncordon {{ inventory_hostname }}"
      ansible.builtin.command: "kubectl uncordon {{ k8s_node_name.stdout }}"
      delegate_to: "{{ groups['rke2_servers'][0] }}"
      when: k8s_node_name.stdout | length > 0

    - name: Show update summary
      ansible.builtin.debug:
        msg: >
          {{ inventory_hostname }}: updated={{ dnf_update.changed }},
          rebooted={{ reboot_check.rc != 0 }},
          rke2_upgraded={{ rke2_rpm_before.stdout != rke2_rpm_after.stdout }}
