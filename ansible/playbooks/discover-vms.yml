---
# ============================================================================
# Discover DHCP-assigned VM IPs via virsh on localhost (KVM host)
# and register them as in-memory inventory hosts.
# ============================================================================
- name: Discover VM IPs from localhost
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Wait for VMs to get DHCP leases
      ansible.builtin.shell: |
        # Try virsh domifaddr first (works with libvirt-managed DHCP)
        ip=$(virsh domifaddr {{ item.name }} 2>/dev/null | grep -oP '\d+\.\d+\.\d+\.\d+')
        if [ -n "$ip" ]; then echo "$ip"; exit 0; fi

        # Fallback: get MAC from virsh, look up in ARP table (bridged networking)
        mac=$(virsh domiflist {{ item.name }} 2>/dev/null | awk '/br/ {print $5}')
        if [ -z "$mac" ]; then exit 1; fi

        # Ping broadcast to populate ARP table
        bridge=$(virsh domiflist {{ item.name }} 2>/dev/null | awk '/br/ {print $3}')
        subnet=$(ip -4 addr show "$bridge" 2>/dev/null | grep -oP '\d+\.\d+\.\d+' | head -1)
        if [ -n "$subnet" ]; then ping -b -c 2 -w 1 "${subnet}.255" >/dev/null 2>&1 || true; fi

        ip=$(arp -an 2>/dev/null | grep -i "$mac" | grep -oP '\d+\.\d+\.\d+\.\d+')
        if [ -n "$ip" ]; then echo "$ip"; exit 0; fi

        # Fallback: check dhcpd leases file if available
        for f in /var/lib/dhcpd/dhcpd.leases /var/lib/dhcp/dhcpd.leases; do
          if [ -f "$f" ]; then
            ip=$(grep -B5 -i "$mac" "$f" 2>/dev/null | grep 'lease ' | tail -1 | awk '{print $2}')
            if [ -n "$ip" ]; then echo "$ip"; exit 0; fi
          fi
        done

        exit 1
      register: vm_ips
      loop: "{{ vms }}"
      retries: 30
      delay: 10
      until: vm_ips is not failed
      changed_when: false

    - name: Build discovered IP map
      ansible.builtin.set_fact:
        discovered_vms: >-
          {{
            discovered_vms | default([]) + [{
              'name': item.item.name,
              'role': item.item.role,
              'ip': item.stdout | trim
            }]
          }}
      loop: "{{ vm_ips.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Display discovered IPs
      ansible.builtin.debug:
        msg: "{{ item.name }} ({{ item.role }}): {{ item.ip }}"
      loop: "{{ discovered_vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add servers to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        ansible_host: "{{ item.ip }}"
        ansible_user: rke
        groups:
          - rke2_servers
          - rke2_cluster
      loop: "{{ discovered_vms | selectattr('role', 'equalto', 'server') }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add agents to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        ansible_host: "{{ item.ip }}"
        ansible_user: rke
        groups:
          - rke2_agents
          - rke2_cluster
      loop: "{{ discovered_vms | selectattr('role', 'equalto', 'agent') }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Wait for SSH to be reachable on all VMs
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 22
        timeout: 120
      loop: "{{ discovered_vms }}"
      loop_control:
        label: "{{ item.name }}"
