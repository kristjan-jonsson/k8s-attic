---
# ============================================================================
# Discover DHCP-assigned VM IPs via virsh on localhost (KVM host)
# and register them as in-memory inventory hosts.
# Skipped when rke2_servers/rke2_agents already have hosts in inventory.yml.
# ============================================================================
- name: Discover VM IPs from localhost
  hosts: localhost
  connection: local
  gather_facts: false
  tags: always

  tasks:
    # Skip discovery when the cluster hosts are already listed in inventory.yml
    - name: Skip discovery if inventory already has cluster hosts
      ansible.builtin.meta: end_play
      when: groups['rke2_cluster'] | default([]) | length > 0

    - name: Discover each VM IP
      ansible.builtin.include_tasks: discover-vm-single.yml
      loop: "{{ vms }}"
      loop_control:
        loop_var: vm

    - name: Display discovered IPs
      ansible.builtin.debug:
        msg: "{{ item.name }} ({{ item.role }}): {{ item.ip }}"
      loop: "{{ discovered_vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add servers to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        ansible_host: "{{ item.ip }}"
        ansible_user: rke
        groups:
          - rke2_servers
          - rke2_cluster
      loop: "{{ discovered_vms | selectattr('role', 'equalto', 'server') }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Add agents to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        ansible_host: "{{ item.ip }}"
        ansible_user: rke
        groups:
          - rke2_agents
          - rke2_cluster
      loop: "{{ discovered_vms | selectattr('role', 'equalto', 'agent') }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Wait for SSH to be reachable on all VMs
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 22
        timeout: 120
      loop: "{{ discovered_vms }}"
      loop_control:
        label: "{{ item.name }}"
