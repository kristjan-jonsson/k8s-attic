[defaults]
inventory = inventory.yml
become = true
host_key_checking = false
timeout = 30
gathering = smart
fact_caching = memory
stdout_callback = yaml

[privilege_escalation]
become = true
become_method = sudo
become_user = root

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
