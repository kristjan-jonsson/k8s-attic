[defaults]
inventory = inventory.yml
roles_path = roles
host_key_checking = false
timeout = 30
gathering = smart
fact_caching = memory
stdout_callback = default

[privilege_escalation]
# Most tasks here run as the invoking user (kubectl/helm/podman all use
# your own config); only roles/hosts_dns needs root, and it opts in
# explicitly per-task with become: true.
become = false
become_method = sudo
become_user = root
