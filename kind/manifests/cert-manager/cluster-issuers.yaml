# ============================================================================
# ClusterIssuers for cert-manager
# Apply AFTER cert-manager is installed and running
# ============================================================================

# --- Self-signed issuer (for internal/dev use) ---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}

---
# --- Internal CA (recommended for local *.haaloft.local hostnames) ---
# Step 1: Create a self-signed CA certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: haaloft-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Haaloft Kind CA
  secretName: haaloft-ca-secret
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
    # Default rotationPolicy is "Always" - any respec of this Certificate
    # (even something cosmetic like commonName) would otherwise silently
    # generate a new keypair, invalidating every already-issued leaf cert
    # (vault/keycloak/harbor/grafana/myapp) signed by the old one.
    rotationPolicy: Never
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer

---
# Step 2: Create a ClusterIssuer using the CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: haaloft-ca-issuer
spec:
  ca:
    secretName: haaloft-ca-secret
