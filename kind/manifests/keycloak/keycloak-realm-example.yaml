# ============================================================================
# Example Keycloak Realm Configuration
# Import via Keycloak Admin UI or API after deployment
# This creates a "haaloft" realm for your .NET applications
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: keycloak
data:
  haaloft-realm.json: |
    {
      "realm": "haaloft",
      "enabled": true,
      "displayName": "Haaloft Kind",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "minimumQuickLoginWaitSeconds": 60,
      "waitIncrementSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "maxDeltaTimeSeconds": 43200,
      "failureFactor": 5,
      "defaultSignatureAlgorithm": "RS256",
      "accessTokenLifespan": 300,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "clients": [
        {
          "clientId": "dotnet-webapp",
          "name": "Example .NET Web App",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "redirectUris": [
            "https://myapp.haaloft.local/*"
          ],
          "webOrigins": [
            "https://myapp.haaloft.local"
          ],
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "publicClient": false,
          "protocol": "openid-connect"
        },
        {
          "clientId": "dotnet-api",
          "name": "Example .NET API",
          "enabled": true,
          "bearerOnly": true,
          "protocol": "openid-connect"
        }
      ],
      "roles": {
        "realm": [
          { "name": "admin", "description": "Administrator" },
          { "name": "user", "description": "Regular user" }
        ]
      }
    }
