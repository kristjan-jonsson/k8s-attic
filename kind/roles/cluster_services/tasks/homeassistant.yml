---
# Home Assistant

- name: Deploy Home Assistant
  ansible.builtin.command: >
    kubectl apply -f {{ manifests_dir }}/homeassistant/homeassistant-deploy.yaml --context {{ kube_context }}
  become: false

- name: Wait for Home Assistant to be ready
  ansible.builtin.shell: |
    kubectl -n homeassistant --context {{ kube_context }} wait --for=condition=Available deployment/homeassistant --timeout=180s
  become: false
  retries: 3
  delay: 30
  register: ha_ready
  until: ha_ready is not failed
  changed_when: false

- name: Display Home Assistant info
  ansible.builtin.debug:
    msg: |
      Home Assistant deployed!
      URL: https://home.{{ domain }}:{{ ingress_https_port }}
      First visit will start the onboarding wizard.
