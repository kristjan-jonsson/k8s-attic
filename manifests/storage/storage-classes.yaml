# ============================================================================
# Storage Classes for different workload types
# Longhorn creates a default 'longhorn' StorageClass automatically.
# These provide additional options for specific use cases.
# ============================================================================

# High-performance storage for databases (PostgreSQL, SQL Server, etc.)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-db
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain  # Don't delete data when PVC is deleted
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  fsType: "xfs"

---
# Single-replica storage for non-critical data (caches, temp files)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-single
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "2880"
  fsType: "xfs"
