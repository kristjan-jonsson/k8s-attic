# ============================================================================
# Longhorn - Distributed Block Storage for Kubernetes
# Install: helm install longhorn longhorn/longhorn -n longhorn-system --create-namespace -f longhorn-values.yaml
# ============================================================================

# Default settings
defaultSettings:
  # Keep 2 replicas across nodes for redundancy
  defaultReplicaCount: 2

  # Backup target (optional - set up NFS or S3 for backups)
  # backupTarget: nfs://nas.haaloft.local:/backup/longhorn
  # backupTargetCredentialSecret: ""

  # CPU reserved per instance-manager pod, as % of node CPU (default 12).
  # Actual use is well under 5% of a 2-core node.
  guaranteedInstanceManagerCPU: '{"v1":"5","v2":"5"}'

  # Storage reservation - leave 15% free on each node
  storageMinimalAvailablePercentage: 15
  storageOverProvisioningPercentage: 100

  # Auto-delete workload pod when volume is detached unexpectedly
  autoDeletePodWhenVolumeDetachedUnexpectedly: true

  # Let rolling node drains (update-reboot.yml) proceed when a node holds the
  # last replica of a detached volume. The default blocks the drain forever.
  nodeDrainPolicy: allow-if-replica-is-stopped

# Enable the Longhorn UI
longhornUI:
  replicas: 1

# Ingress for Longhorn UI
ingress:
  enabled: true
  ingressClassName: nginx
  host: longhorn.haaloft.local
  tls: true
  tlsSecret: longhorn-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

# Resource limits suitable for home lab
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
