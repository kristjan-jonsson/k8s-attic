# ============================================================================
# OpenTelemetry Collector - single gateway for app telemetry
# Chart: open-telemetry/opentelemetry-collector
# Install: helm install otel-collector open-telemetry/opentelemetry-collector \
#            -n monitoring --version 0.178.1 -f otel-collector-values.yaml
#
# Apps point their OTLP exporter at:
#   gRPC: http://otel-collector.monitoring:4317   (.NET default)
#   HTTP: http://otel-collector.monitoring:4318
#
# Routing:
#   metrics -> Prometheus  (OTLP receiver)
#   logs    -> Loki        (native OTLP endpoint)
#   traces  -> Tempo       (OTLP gRPC)
# ============================================================================

mode: deployment
fullnameOverride: otel-collector

image:
  repository: otel/opentelemetry-collector-k8s

# Adds k8s.namespace.name, k8s.pod.name, k8s.deployment.name etc. to all signals
presets:
  kubernetesAttributes:
    enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# Only OTLP in, plus the collector's own metrics port for Prometheus
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true

serviceMonitor:
  enabled: true
  extraLabels:
    release: monitoring

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null   # Prometheus scrapes the collector's :8888 directly via the ServiceMonitor
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}

  exporters:
    debug: null
    # Prometheus OTLP receiver (requires prometheusSpec.enableOTLPReceiver: true)
    # The exporter appends /v1/metrics
    otlp_http/prometheus:
      endpoint: http://monitoring-kube-prometheus-prometheus.monitoring:9090/api/v1/otlp
      tls:
        insecure: true
    # Loki native OTLP endpoint. The exporter appends /v1/logs
    otlp_http/loki:
      endpoint: http://loki.monitoring:3100/otlp
      tls:
        insecure: true
    otlp_grpc/tempo:
      endpoint: tempo.monitoring:4317
      tls:
        insecure: true

  service:
    pipelines:
      # k8s_attributes processor config is added by the kubernetesAttributes preset
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [otlp_http/prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [otlp_http/loki]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, batch]
        exporters: [otlp_grpc/tempo]
