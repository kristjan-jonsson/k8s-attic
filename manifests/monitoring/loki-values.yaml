# ============================================================================
# Loki - log storage (single binary, filesystem on Longhorn)
# Chart: grafana-community/loki
# Install: helm install loki grafana-community/loki \
#            -n monitoring --version 20.2.1 -f loki-values.yaml
#
# Apps send logs over OTLP to the OTel Collector, which forwards them to
#   http://loki.monitoring:3100/otlp
# ============================================================================

deploymentMode: Monolithic

loki:
  # Single tenant - no X-Scope-OrgID header needed
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2026-11-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    volume_enabled: true
    # OTLP log attributes (trace_id, span_id, etc.) are kept as structured metadata
    allow_structured_metadata: true
    retention_period: 14d

  # Compactor enforces retention_period
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Simple-scalable targets are off in single-binary mode
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# --- Extras not needed for a single small instance ---
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

# --- Let Prometheus scrape Loki's own metrics ---
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring
