# ============================================================================
# kube-prometheus-stack - Prometheus + Alertmanager + Grafana + Node Exporter
# Chart: prometheus-community/kube-prometheus-stack
#
# Logs (Loki), traces (Tempo) and the OTel Collector are separate releases in
# the same namespace - see loki-values.yaml, tempo-values.yaml,
# otel-collector-values.yaml
# ============================================================================

# --- Prometheus ---
prometheus:
  prometheusSpec:
    # Retain metrics for 30 days
    retention: 30d
    retentionSize: "8GB"

    # Storage for metrics
    # The Longhorn volume was lowered to 2 replicas by hand (numberOfReplicas on
    # the volume). A recreated PVC gets the storage class default (3) again.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Scrape interval
    scrapeInterval: 30s
    evaluationInterval: 30s

    # Additional scrape targets
    additionalScrapeConfigs:
      - job_name: homeassistant
        scrape_interval: 60s
        metrics_path: /api/prometheus
        authorization:
          credentials: REPLACE_WITH_HA_LONG_LIVED_TOKEN
        static_configs:
          - targets: ["homeassistant.homeassistant.svc.cluster.local:80"]
            labels:
              source: homeassistant

    # Resource limits
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

    # --- Push endpoints (in-cluster only, no auth - never expose via ingress) ---
    # OTLP metrics from the OTel Collector:
    #   http://monitoring-kube-prometheus-prometheus.monitoring:9090/api/v1/otlp/v1/metrics
    enableOTLPReceiver: true
    # Remote write from Tempo's metrics generator (span metrics + service graph)
    enableRemoteWriteReceiver: true

    # OTLP resource attributes to keep as labels on every series.
    # service.name / service.instance.id always become job / instance;
    # all other resource attributes go to the target_info metric.
    otlp:
      promoteResourceAttributes:
        - service.version
        - deployment.environment.name
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.pod.name

    # Pushed samples can arrive slightly late or out of order
    tsdb:
      outOfOrderTimeWindow: 30m

# --- Grafana ---
grafana:
  adminUser: admin
  adminPassword: changeme-grafana-admin

  # The Longhorn volume was lowered to 2 replicas by hand (numberOfReplicas on
  # the volume). A recreated PVC gets the storage class default (3) again.
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 2Gi

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.haaloft.local
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.haaloft.local
    annotations:
      cert-manager.io/cluster-issuer: haaloft-ca-issuer

  # Grafana 13 uses ~250Mi at idle and was OOMKilled at a 256Mi limit
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # The Longhorn volume is ReadWriteOnce, so a rolling update can't start the
  # new pod while the old one holds the volume. Stop the old pod first.
  deploymentStrategy:
    type: Recreate

  # Loki + Tempo data sources (Prometheus and Alertmanager are added by the chart).
  # They link to each other: trace -> logs, log line -> trace, trace -> metrics.
  # UIDs are fixed so the links keep working. "$$" escapes "$" in Grafana provisioning.
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring:3100
      jsonData:
        derivedFields:
          # OTLP logs carry trace_id as structured metadata
          - name: TraceID
            matcherType: label
            matcherRegex: trace_id
            datasourceUid: tempo
            url: "$${__value.raw}"
            urlDisplayLabel: View trace
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          filterByTraceID: true
          tags:
            - key: service.name
              value: service_name
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        lokiSearch:
          datasourceUid: loki

  # Default dashboards are included automatically:
  # - K8S cluster overview
  # - Node exporter
  # - Pod/container metrics
  # - etcd
  # - API server
  # - CoreDNS

# --- Alertmanager ---
alertmanager:
  enabled: true
  # In-cluster only: monitoring-kube-prometheus-alertmanager.monitoring:9093
  # Grafana gets an Alertmanager data source automatically (Alerting -> Alert rules / Silences).
  alertmanagerSpec:
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  # The chart's default config sends everything to a "null" receiver, so alerts
  # show up in Grafana / Alertmanager but are not delivered anywhere yet.
  # To get notified, override alertmanager.config with a real receiver, e.g.:
  #
  # config:
  #   route:
  #     receiver: email
  #     group_by: [namespace, alertname]
  #     routes:
  #       - receiver: "null"
  #         matchers: [alertname = "Watchdog"]
  #   receivers:
  #     - name: "null"
  #     - name: email
  #       email_configs:
  #         - to: you@example.com
  #           from: alertmanager@haaloft.local
  #           smarthost: smtp.example.com:587
  #           auth_username: you@example.com
  #           auth_password: REPLACE_ME

# --- Node Exporter (runs on all nodes) ---
prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance

nodeExporter:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi

# --- Kube State Metrics ---
kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# --- Component monitors ---
kubeApiServer:
  enabled: true
kubeControllerManager:
  enabled: true
kubeScheduler:
  enabled: true
kubeProxy:
  enabled: true
kubeEtcd:
  enabled: true
coreDns:
  enabled: true
