# ============================================================================
# Keycloak - Identity and Access Management
# Install: helm install keycloak bitnami/keycloak -n keycloak -f keycloak-values.yaml
# ============================================================================

# Authentication
auth:
  adminUser: admin
  # Change this! Or better yet, use a K8S secret
  adminPassword: "changeme-use-vault-secret"

# Production mode with TLS termination at ingress
production: true
proxyHeaders: xforwarded

# Use PostgreSQL as the database backend
postgresql:
  enabled: true
  auth:
    postgresPassword: "changeme-pg-admin"
    username: keycloak
    password: "changeme-pg-keycloak"
    database: keycloak
  primary:
    persistence:
      enabled: true
      storageClass: longhorn-db
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

# Keycloak resource limits
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

# Single replica for home lab
replicaCount: 1

# Ingress configuration
ingress:
  enabled: true
  ingressClassName: nginx
  hostname: auth.haaloft.local
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"

# Extra environment variables for Keycloak
extraEnvVars:
  - name: KC_FEATURES
    value: "token-exchange,admin-fine-grained-authz"

# Health checks
livenessProbe:
  enabled: true
  initialDelaySeconds: 120
readinessProbe:
  enabled: true
  initialDelaySeconds: 30
