# ============================================================================
# External Secrets Operator - syncs secrets from external stores (e.g. Vault)
# Install: helm install external-secrets external-secrets/external-secrets \
#            -n external-secrets --create-namespace --version 2.12.0 -f external-secrets-values.yaml
# ============================================================================

installCRDs: true

replicaCount: 1

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

certController:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
