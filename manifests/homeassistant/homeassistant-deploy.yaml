---
apiVersion: v1
kind: Namespace
metadata:
  name: homeassistant

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config
  namespace: homeassistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-db
  resources:
    requests:
      storage: 5Gi

---
# ConfigMap to configure HA to trust the reverse proxy
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-proxy-config
  namespace: homeassistant
data:
  setup-proxy.sh: |
    #!/bin/sh
    CONFIG="/config/configuration.yaml"
    if [ ! -f "$CONFIG" ]; then
      cat > "$CONFIG" <<'EOF'
    homeassistant:
      name: Home
      external_url: "https://home.haaloft.local"
      internal_url: "http://homeassistant.homeassistant.svc.cluster.local:80"
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16
        - 10.43.0.0/16
        - 192.168.0.0/24
        - 127.0.0.1
    EOF
    elif ! grep -q "trusted_proxies" "$CONFIG"; then
      cat >> "$CONFIG" <<'EOF'

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16
        - 10.43.0.0/16
        - 192.168.0.0/24
        - 127.0.0.1
    EOF
    fi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      initContainers:
        - name: setup-proxy
          image: docker.io/library/busybox:latest
          command: ["sh", "/scripts/setup-proxy.sh"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - name: http
              containerPort: 8123
          env:
            - name: TZ
              value: Atlantic/Reykjavik
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
        - name: scripts
          configMap:
            name: homeassistant-proxy-config
            defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  selector:
    app: homeassistant
  ports:
    - port: 80
      targetPort: 8123

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeassistant
  namespace: homeassistant
  annotations:
    cert-manager.io/cluster-issuer: haaloft-ca-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/websocket-services: homeassistant
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - home.haaloft.local
      secretName: homeassistant-tls
  rules:
    - host: home.haaloft.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homeassistant
                port:
                  number: 80
