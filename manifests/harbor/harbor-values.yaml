# ============================================================================
# Harbor Container Registry
# Install: helm install harbor harbor/harbor -n harbor --create-namespace -f harbor-values.yaml
# ============================================================================

expose:
  type: ingress
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: harbor-tls
  ingress:
    hosts:
      core: registry.haaloft.local
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: haaloft-ca-issuer
      nginx.ingress.kubernetes.io/proxy-body-size: "0"       # No limit for image pushes
      nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "900"

externalURL: https://registry.haaloft.local

# Admin password
harborAdminPassword: changeme-harbor-admin

# Persistent storage using Longhorn
persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      storageClass: longhorn
      size: 10Gi
    database:
      storageClass: longhorn-db
      size: 5Gi
    redis:
      storageClass: longhorn-single
      size: 2Gi
    trivy:
      storageClass: longhorn-single
      size: 5Gi

# Database (PostgreSQL)
database:
  type: internal
  internal:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi

# Redis
redis:
  type: internal
  internal:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

# Core service
core:
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi

# Registry
registry:
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi

# Trivy vulnerability scanner
trivy:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi

# Job service
jobservice:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# Portal (web UI)
portal:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

# Enable metrics for monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: false  # Enable if you add Prometheus later
