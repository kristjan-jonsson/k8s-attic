---
apiVersion: v1
kind: Namespace
metadata:
  name: zigbee2mqtt

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-data
  namespace: zigbee2mqtt
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-db
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zigbee2mqtt-config
  namespace: zigbee2mqtt
data:
  configuration.yaml: |
    homeassistant: true
    permit_join: false

    mqtt:
      base_topic: zigbee2mqtt
      server: mqtt://mosquitto.mqtt.svc.cluster.local:1883

    serial:
      port: tcp://192.168.0.176:6638
      adapter: ember

    frontend:
      port: 8080

    advanced:
      pan_id: GENERATE
      network_key: GENERATE
      channel: 11
      log_level: info
      last_seen: ISO_8601

    availability: true

    device_options:
      retain: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: zigbee2mqtt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
    spec:
      initContainers:
        - name: setup-config
          image: docker.io/library/busybox:latest
          command: ["sh", "-c"]
          args:
            - |
              if [ ! -f /data/configuration.yaml ]; then
                cp /config/configuration.yaml /data/configuration.yaml
                echo "Initial config copied"
              else
                echo "Config already exists, skipping"
              fi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      containers:
        - name: zigbee2mqtt
          image: ghcr.io/koenkk/zigbee2mqtt:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: Atlantic/Reykjavik
            - name: ZIGBEE2MQTT_DATA
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
        - name: config
          configMap:
            name: zigbee2mqtt-config

---
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
  namespace: zigbee2mqtt
spec:
  selector:
    app: zigbee2mqtt
  ports:
    - port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zigbee2mqtt
  namespace: zigbee2mqtt
  annotations:
    cert-manager.io/cluster-issuer: haaloft-ca-issuer
    nginx.ingress.kubernetes.io/websocket-services: zigbee2mqtt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - zigbee.haaloft.local
      secretName: zigbee2mqtt-tls
  rules:
    - host: zigbee.haaloft.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zigbee2mqtt
                port:
                  number: 80
