# ============================================================================
# Example Ingress resource for a .NET web application
# Duplicate and modify for each of your projects
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-dotnet-app
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Uncomment to protect with Keycloak via OAuth2 Proxy
    # nginx.ingress.kubernetes.io/auth-url: "https://oauth2.haaloft.local/oauth2/auth"
    # nginx.ingress.kubernetes.io/auth-signin: "https://oauth2.haaloft.local/oauth2/start?rd=$scheme://$host$request_uri"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - myapp.haaloft.local
      secretName: myapp-tls
  rules:
    - host: myapp.haaloft.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myapp-service
                port:
                  number: 80
